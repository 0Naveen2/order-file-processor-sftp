name: File Processor CI CD

on:
  push:
    branches:
      - development

  workflow_dispatch:

jobs:
  build-test-publish-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Setup Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build Application
        run: |
          mvn clean compile \
            -DskipMunitTests \
            -Dmule.key="${{ secrets.SECURE_KEY }}" \
            -s .maven/settings.xml
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

      - name: Run MUnit Tests
        run: |
          mvn test \
            -Dmule.key="${{ secrets.SECURE_KEY }}" \
            -s .maven/settings.xml
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

      - name: Package Application
        run: |
          mvn package \
            -DskipMunitTests \
            -Dmule.key="${{ secrets.SECURE_KEY }}" \
            -s .maven/settings.xml
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

      - name: Publish to Exchange
        run: |
          mvn deploy \
            -DskipMunitTests \
            -DskipMuleDeploy \
            -Dmule.key="${{ secrets.SECURE_KEY }}" \
            -s .maven/settings.xml
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

      - name: Deploy to CloudHub 2.0
        run: |
          mvn mule:deploy \
            -DskipMunitTests
